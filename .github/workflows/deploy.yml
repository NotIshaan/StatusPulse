name: Deploy Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # Sets the permissions granted to the GITHUB_TOKEN for the actions in this job.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- TASK 2(b) DEPLOYMENT AND ALERTING STEPS ---

      - name: Deploy to Server via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/StatusPulse
            ./deploy.sh

      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":" **StatusPulse Deployment Successful!**\nCommit: `${{ github.sha }}`\nThe new image is healthy and live!"}' \
          ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: Notify Failure and Rollback
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":" **StatusPulse Deployment FAILED!**\nCommit: `${{ github.sha }}`\nHealth check failed. The system has automatically rolled back to the previous stable version."}' \
          ${{ secrets.ALERT_WEBHOOK_URL }}
